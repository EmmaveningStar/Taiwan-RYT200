name: 更新課程網站

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 23 * * *'
  issues:
    types: [labeled, unlabeled, edited, deleted]

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 檢查投稿審核同步
        run: python -m unittest discover -s tests -v

      - name: 修正資料路徑
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('update.py')
          p.write_text(
              p.read_text().replace(
                  'Path("site/data.json")',
                  'Path("data.json")'
              )
          )
          PY

      - name: 更新課程與投稿
        run: python update.py
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_APPROVED_FEED_URL: 'https://script.google.com/macros/s/AKfycbzsBwMAt110nVZ-P4wRBgxXDFTKn7RZVokO41lnoKLV6VkqjWEHhvTEjdpwwsXvehZL8Q/exec'
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: course-source-review
          path: review.json

      - name: 準備網站檔案
        run: |
          mkdir -p _site
          cp index.html data.json _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
